<style>
:root{color-scheme:dark;--bg:#0d0a12;--ink:#f6ece6;--gold:#e9c98f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:300;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,#000b 100%)}
.frame{position:fixed;inset:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));border:1px solid #f6ece629;pointer-events:none}
.tag{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.55;pointer-events:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;transition:opacity 1.4s}
.hide{opacity:0;pointer-events:none}
.k{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
h1{font:italic 600 clamp(46px,13vw,96px)/1 'Cormorant Garamond',Georgia,serif;margin:0;background:linear-gradient(100deg,#ff8fa8,#ffd9a0,#c9a5ff,#ff8fa8);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:250%}}
button{font:400 12px 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);background:#ffffff10;border:1px solid #f6ece655;border-radius:40px;padding:15px 34px;cursor:pointer;backdrop-filter:blur(6px)}
button:active{background:#ffffff30}
#hint{position:fixed;left:0;right:0;top:46%;text-align:center;font:italic 600 22px 'Cormorant Garamond',Georgia,serif;opacity:.8;pointer-events:none;transition:opacity 2s}
.bt{position:fixed;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transition:opacity 1.2s}
#pl{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(86vw,400px);padding:18px 22px;background:#0d0a12d9;border:1px solid #e9c98f66;text-align:left;transition:opacity .6s;opacity:0;pointer-events:none}
#pl.show{opacity:1}
#pl b{display:block;font-weight:400;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
#pl i{display:block;font:italic 600 30px/1.15 'Cormorant Garamond',Georgia,serif;margin:6px 0}
#pl span{font-size:13px;line-height:1.5;opacity:.8}

.ov,.bt,#pl,#hint{z-index:5}.grain,.vig,.frame{z-index:9}
#dd{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.d{position:absolute;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px currentColor);animation:fi 1s both,fl 7s ease-in-out infinite alternate}
.d path{stroke:currentColor;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{from{opacity:0}}
@keyframes fl{to{transform:translateY(-14px) rotate(var(--r2))}}
#pol{position:fixed;left:50%;top:46%;z-index:3;width:min(68vw,300px,calc(46vh*.75));padding:12px 12px 14px;background:#fff7ee;box-shadow:0 20px 60px #000c,0 0 80px #ff6fa566;transform:translate(-50%,-50%) scale(.3) rotate(-14deg);opacity:0;transition:all 1.4s cubic-bezier(.2,1.3,.4,1);pointer-events:none;text-align:center;color:#3a1c33}
#pol.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
#pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
#pol p{font:italic 600 26px/1.1 'Cormorant Garamond',Georgia,serif;margin:12px 0 2px}
#pol small{font-size:11px;letter-spacing:.1em;opacity:.7}
#pol:before,#pol:after{content:'';position:absolute;top:-12px;left:-18px;width:78px;height:24px;background:#ffb3c9bb;transform:rotate(-8deg)}
#pol:after{left:auto;right:-18px;background:#ffe28abb;transform:rotate(9deg)}
.hh{position:fixed;bottom:-40px;z-index:4;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style></head>
